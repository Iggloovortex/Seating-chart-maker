<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2933" />
  <title>Seating Chart Maker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>" />
</head>
<body>
  <!-- ===== Inline SVG icon symbols (reused by grid, picker, export) ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ic-desktop" viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="19" rx="1.2" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9.5 6h5M9.5 8.5h5" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="12" cy="17.5" r="1.3" fill="currentColor"/>
      </symbol>
      <symbol id="ic-laptop" viewBox="0 0 24 24">
        <rect x="5" y="5" width="14" height="9" rx="1" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3 18h18l-1.5-2H4.5L3 18z" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="1" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9 20h6m-3-4v4" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <!-- The Monitor icon, drawn twice side by side at half width. -->
      <symbol id="ic-monitor-double" viewBox="0 0 24 24">
        <rect x="0.8" y="5" width="10.4" height="7" rx="1" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M4.2 17h3.6m-1.8-5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="12.8" y="5" width="10.4" height="7" rx="1" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M16.2 17h3.6m-1.8-5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-kvm" viewBox="0 0 24 24">
        <rect x="3" y="3.5" width="18" height="12" rx="1" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="6.6" cy="7.2" r=".85" fill="currentColor"/>
        <circle cx="6.6" cy="11.8" r=".85" fill="currentColor"/>
        <path d="M9.2 7.2h8.2M9.2 11.8h8.2" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M9 20h6m-3-4.5V20" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-server" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="6" rx="1.2" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <rect x="3" y="14" width="18" height="6" rx="1.2" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="6.6" cy="7" r=".9" fill="currentColor"/>
        <circle cx="6.6" cy="17" r=".9" fill="currentColor"/>
        <path d="M10 7h7M10 17h7" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-person" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.2" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-chair" viewBox="0 0 24 24">
        <path d="M8 3V20M8 13H17V20M8 8H14" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ic-question" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9.4 9.4a2.7 2.7 0 1 1 3.3 2.7c-.9.25-1.2.85-1.2 1.65v.35" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="11.5" cy="17.2" r="1.05" fill="currentColor"/>
      </symbol>
      <symbol id="ic-star" viewBox="0 0 24 24">
        <path d="M12 3l2.5 5.3 5.5.8-4 4 1 5.6L12 16l-5 2.7 1-5.6-4-4 5.5-.8L12 3z" fill="var(--icon-fill, none)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </symbol>
      <!-- UI icons (toolbar). Stroked with currentColor so CSS can colour them. -->
      <symbol id="ui-new" viewBox="0 0 24 24">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-save" viewBox="0 0 24 24">
        <path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8 3v6h8V3M8 21v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-open" viewBox="0 0 24 24">
        <path d="M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v2H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M3 10h18l-2 9H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-share" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="6" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="19" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8.4 10.8l7.2-4.2M8.4 13.2l7.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="ui-print" viewBox="0 0 24 24">
        <path d="M7 9V3h10v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M5 9h14a2 2 0 0 1 2 2v6h-4v4H7v-4H3v-6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-select" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-table" viewBox="0 0 24 24">
        <rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2.5 12h19" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
      <symbol id="ui-select-off" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
      <!-- Orientation: a broken ring with a solid arrowhead at the open end, its
           middle left clear for the button's L or P. The two are mirror images —
           the landscape arrow sweeps clockwise off the top-right, the portrait
           one anticlockwise off the bottom-right. -->
      <symbol id="ui-orient-l" viewBox="0 0 24 24">
        <path d="M18.43 17.4A8.4 8.4 0 1 1 16.2 4.73" fill="none" stroke="currentColor"
              stroke-width="2.6" stroke-linecap="round"/>
        <path d="M19.84 6.83 13.88 6.74 16.78 1.72Z" fill="currentColor"/>
      </symbol>
      <symbol id="ui-orient-p" viewBox="0 0 24 24">
        <path d="M18.43 6.6A8.4 8.4 0 1 0 16.2 19.27" fill="none" stroke="currentColor"
              stroke-width="2.6" stroke-linecap="round"/>
        <path d="M19.84 17.17 13.88 17.26 16.78 22.28Z" fill="currentColor"/>
      </symbol>

      <!-- ===== Multi-select filter toggles ===== -->
      <!-- Every square on the grid -->
      <symbol id="ui-f-all" viewBox="0 0 24 24">
        <rect x="3" y="3" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="13" y="3" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="3" y="13" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="13" y="13" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </symbol>
      <!-- Filled (was "seated") — a square in use -->
      <symbol id="ui-f-filled" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2.6" fill="currentColor"/>
      </symbol>
      <!-- Blank — a square with nothing in it, ever -->
      <symbol id="ui-f-blank" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2.6" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-dasharray="3.4 2.6"/>
      </symbol>
      <!-- Ghost — emptied, but still holding what it had -->
      <!-- Ghost — a square faded all through, frame and lines alike, so it reads
           as one translucent thing rather than a solid box holding faint text. -->
      <symbol id="ui-f-ghost" viewBox="0 0 24 24">
        <g opacity=".45">
          <rect x="3.5" y="3.5" width="17" height="17" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M7.5 10h9M7.5 14h5.5" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round"/>
        </g>
      </symbol>
      <!-- Labelled — a square carrying label lines -->
      <symbol id="ui-f-labeled" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M7.5 10h9M7.5 14h5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <!-- Iconed — a square carrying an icon -->
      <symbol id="ui-f-icons" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 7.6l1.55 3.25 3.45.48-2.5 2.42.6 3.45L12 15.6l-3.1 1.6.6-3.45-2.5-2.42 3.45-.48z"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <!-- Tables -->
      <symbol id="ui-f-tables" viewBox="0 0 24 24">
        <rect x="2.5" y="5.5" width="19" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M6 13.5V19M18 13.5V19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <!-- The "not" ring, layered over a filter to negate it -->
      <symbol id="ui-no" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.6" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M5.2 18.8 18.8 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <!-- Small corner variant of the same idea -->
      <symbol id="ui-no-badge" viewBox="0 0 24 24">
        <circle cx="17.2" cy="17.2" r="5.6" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.8"/>
        <path d="M13.6 20.8 20.8 13.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>

      <!-- Corner "and also" badge, the counterpart of ui-no-badge -->
      <symbol id="ui-yes-badge" viewBox="0 0 24 24">
        <circle cx="17.2" cy="17.2" r="5.6" fill="var(--surface, #fff)" stroke="currentColor" stroke-width="1.8"/>
        <path d="M17.2 14.2v6M14.2 17.2h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>

      <!-- ===== Actions ===== -->
      <symbol id="ui-pencil" viewBox="0 0 24 24">
        <path d="M4 20.2h4.1L20 8.3l-4.1-4.1L4 16.1v4.1z" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M14.4 5.7 18.5 9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="ui-copy" viewBox="0 0 24 24">
        <rect x="8.5" y="2.8" width="12.2" height="14.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.4 21.2H5.3a2 2 0 0 1-2-2V7.3" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="ui-paste" viewBox="0 0 24 24">
        <path d="M9.2 4.6H7a2 2 0 0 0-2 2v12.6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.6a2 2 0 0 0-2-2h-2.2"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <rect x="9.2" y="2.4" width="5.6" height="4.4" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </symbol>
      <symbol id="ui-trash" viewBox="0 0 24 24">
        <path d="M4.5 6.5h15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M9.5 6.5V4.6a1.4 1.4 0 0 1 1.4-1.4h2.2a1.4 1.4 0 0 1 1.4 1.4V6.5" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M6.4 6.5l1 12.6a1.8 1.8 0 0 0 1.8 1.7h5.6a1.8 1.8 0 0 0 1.8-1.7l1-12.6" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>
      <!-- Fill all — a square being filled in -->
      <!-- Fill all — a tipped paint bucket. Outlined so the bucket still reads at
           24px, with the paint inside it solid to say what the button does; a
           half-shaded box only ever said "half". -->
      <symbol id="ui-fill-all" viewBox="0 0 24 24">
        <path d="M3.4 10.4 10.2 3.6l7.2 7.2-6.8 6.8a1.4 1.4 0 0 1-2 0l-5.2-5.2a1.4 1.4 0 0 1 0-2z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M5.2 12.2h11.1l-5.7 5.7a1.4 1.4 0 0 1-2 0z" fill="currentColor"/>
        <path d="M7.6 7 6 5.4a1.7 1.7 0 0 1 2.4-2.4L10 4.6" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20.2 13.6s2 2.4 2 3.8a2 2 0 1 1-4 0c0-1.4 2-3.8 2-3.8z" fill="currentColor"/>
      </symbol>
      <!-- Merge — two shapes driven inward onto a shared seam -->
      <symbol id="ui-merge" viewBox="0 0 24 24">
        <path d="M8.6 3.4H4.4a1.8 1.8 0 0 0-1.8 1.8v13.6a1.8 1.8 0 0 0 1.8 1.8h4.2" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M15.4 3.4h4.2a1.8 1.8 0 0 1 1.8 1.8v13.6a1.8 1.8 0 0 1-1.8 1.8h-4.2" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M12 4.2v15.6" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-dasharray="2.2 2.6"/>
        <path d="M4.6 12h5.2M7.4 9.6 9.8 12l-2.4 2.4" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.4 12h-5.2M16.6 9.6 14.2 12l2.4 2.4" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <!-- ===== Grid-action row ===== -->
      <symbol id="ui-undo" viewBox="0 0 24 24">
        <path d="M4.2 9.4h9.4a5.8 5.8 0 0 1 0 11.6H7" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8.4 4.2 3.6 9.4l4.8 5.2" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="ui-redo" viewBox="0 0 24 24">
        <path d="M19.8 9.4h-9.4a5.8 5.8 0 0 0 0 11.6H17" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.6 4.2l4.8 5.2-4.8 5.2" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- The square table: a grid whose header row is picked out -->
      <symbol id="ui-rows" viewBox="0 0 24 24">
        <rect x="2.6" y="4" width="18.8" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2.6 9h18.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2.6 14.5h18.8M9.4 9v11M15.6 9v11" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </symbol>
      <!-- Settings. Blocky teeth that meet the ring, not detached rays — a thin
           radial burst reads as brightness, which would be badly wrong next to a
           dark-mode toggle. -->
      <symbol id="ui-settings" viewBox="0 0 24 24">
        <path d="M12 3.1v3.4M12 17.5v3.4M20.9 12h-3.4M6.5 12H3.1M18.29 5.71 15.88 8.12M8.12 15.88l-2.41 2.41M18.29 18.29l-2.41-2.41M8.12 8.12 5.71 5.71"
              fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="6.4" fill="currentColor"/>
        <circle cx="12" cy="12" r="2.9" fill="var(--surface, #fff)"/>
      </symbol>
      <symbol id="ui-search" viewBox="0 0 24 24">
        <circle cx="10.6" cy="10.6" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.4 15.4 20.6 20.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- ===================== Toolbar ===================== -->
    <header class="toolbar">
      <div class="toolbar__side">
        <div class="toolbar__brand">
          <span class="toolbar__logo" aria-hidden="true">🪑</span>
          <span class="toolbar__title">Seating Chart Maker</span>
        </div>
        <!-- File actions: icon-only, under the title -->
        <div class="iconbar" role="group" aria-label="File actions">
          <button id="btn-clear" class="iconbtn iconbtn--new" type="button" title="New — clear the chart" aria-label="New chart">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-new"/></svg>
          </button>
          <button id="btn-save-file" class="iconbtn iconbtn--save" type="button" title="Save File — download a .seatchart file" aria-label="Save file">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-save"/></svg>
          </button>
          <button id="btn-open-file" class="iconbtn iconbtn--open" type="button" title="Open a .seatchart file" aria-label="Open file">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-open"/></svg>
          </button>
          <button id="btn-copy-link" class="iconbtn iconbtn--share" type="button" title="Share — copy a link that reopens this layout" aria-label="Share link">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-share"/></svg>
          </button>
          <button id="btn-print" class="iconbtn iconbtn--print" type="button" title="Print / PDF" aria-label="Print or save as PDF">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-print"/></svg>
          </button>
          <input id="file-input" type="file" accept=".seatchart,application/json,.tsv,text/tab-separated-values" hidden />
        </div>
        <!-- Second row: actions that change the grid rather than the file.
             Undo/redo will join this row. -->
        <div class="iconbar iconbar--grid" role="group" aria-label="Grid actions">
          <button id="btn-copy-format" class="iconbtn" type="button" title="Copy the selected square, labels and all" aria-label="Copy square">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-copy"/></svg>
          </button>
          <button id="btn-paste-format" class="iconbtn" type="button" title="Clone the copied square onto every selected square" aria-label="Paste square">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-paste"/></svg>
          </button>
          <span class="iconbar__sep" aria-hidden="true"></span>
          <!-- Placed, not yet wired: history and the two panes still to come. -->
          <button id="btn-undo" class="iconbtn" type="button" disabled title="Undo — not built yet" aria-label="Undo">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-undo"/></svg>
          </button>
          <button id="btn-redo" class="iconbtn" type="button" disabled title="Redo — not built yet" aria-label="Redo">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-redo"/></svg>
          </button>
          <span class="iconbar__sep" aria-hidden="true"></span>
          <button id="btn-settings" class="iconbtn" type="button" disabled title="Settings — not built yet" aria-label="Settings">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-settings"/></svg>
          </button>
        </div>
      </div>

      <!-- Middle column: entries on top, button bar underneath -->
      <div class="toolbar__main">
       <div class="toolbar__row toolbar__row--entries">
      <div class="toolbar__group toolbar__group--title" role="group" aria-label="Chart title">
        <label class="field field--title">
          <span class="field__label">Title</span>
          <input id="chart-title-input" class="field__input" type="text" placeholder="Untitled chart" maxlength="80" />
        </label>
      </div>

      <div class="toolbar__group" role="group" aria-label="Grid size">
        <label class="field">
          <span class="field__label">Cols</span>
          <input id="grid-cols" class="field__input field__input--num" type="number" min="1" max="40" value="6" inputmode="numeric" />
        </label>
        <span class="field__x">×</span>
        <label class="field">
          <span class="field__label">Rows</span>
          <input id="grid-rows" class="field__input field__input--num" type="number" min="1" max="40" value="5" inputmode="numeric" />
        </label>
      </div>


       </div>

       <div class="toolbar__row toolbar__row--actions">
      <div class="toolbar__group toolbar__group--actions">
        <button id="btn-empty-all" class="btn btn--empty" type="button" title="Empty every square on the grid — labels and colors are kept">Clear Grid</button>
        <button id="btn-preview" class="btn btn--primary" type="button" title="Preview and export">Export</button>
        <button id="btn-reset-sizes" class="btn" type="button" title="Reset every row and column to the default size">Reset sizes</button>
        <button id="btn-true-size" class="btn btn--toggle" type="button" aria-pressed="false" title="Show weighted row/column sizes in the grid">True size</button>
        <button id="btn-select" class="btn btn--icon btn--toggle" type="button" aria-pressed="false" title="Select mode" aria-label="Select mode">
          <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use id="select-icon" href="#ui-select-off"/></svg>
        </button>
      </div>
       </div>
      </div>

      <!-- Default colors: spans both toolbar rows on the right -->
      <div class="defaults" role="group" aria-label="Default colors">
        <!-- Selection filters. Each is a toggle: while it is lit, the squares it
           matches are selected, and turning it off gives up only the squares
           no other lit toggle still claims. -->
        <div class="filterbar" role="group" aria-label="Select by">
          <button id="btn-filter-all" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All squares" aria-label="All squares">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-all"/></svg>
          </button>
          <button id="btn-filter-filled" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All filled" aria-label="All filled">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-filled"/></svg>
          </button>
          <button id="btn-filter-blank" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All blank" aria-label="All blank">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-blank"/></svg>
          </button>
          <button id="btn-filter-labeled" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All labeled" aria-label="All labeled">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-labeled"/></svg>
          </button>
          <button id="btn-filter-unlabeled" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All unlabeled" aria-label="All unlabeled">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-labeled"/><use href="#ui-no-badge"/></svg>
          </button>
          <button id="btn-filter-icons" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All w/ icons" aria-label="All with icons">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-icons"/></svg>
          </button>
          <button id="btn-filter-noicons" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All w/o icons" aria-label="All without icons">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-icons"/><use href="#ui-no-badge"/></svg>
          </button>
          <button id="btn-filter-ghost" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All ghost — emptied squares that still hold content" aria-label="All ghost">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-ghost"/></svg>
          </button>
          <button id="btn-filter-tables" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="All tables" aria-label="All tables">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-tables"/></svg>
          </button>
          <button id="btn-filter-withghost" class="btn btn--icon btn--toggle filterbtn" type="button" aria-pressed="false" title="Include ghost — let the other filters reach emptied squares too" aria-label="Include ghost">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-f-ghost"/><use href="#ui-yes-badge"/></svg>
          </button>
          <!-- Search runs on submit only, so typing never selects half the chart.
               Placed, not yet wired. -->
          <form id="filter-search" class="filtersearch" role="search">
            <input id="filter-query" class="filtersearch__input" type="search" disabled
                   placeholder="Search labels &amp; icons" aria-label="Select squares matching" />
            <button id="btn-filter-search" class="btn btn--icon filtersearch__go" type="submit" disabled
                    title="Search — not built yet" aria-label="Run search">
              <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-search"/></svg>
            </button>
          </form>
        </div>
        <div class="defaults__rule" aria-hidden="true"></div>
        <div class="defaults__set">
          <label class="defaults__item">
            <span class="defaults__label">Fill</span>
            <input id="def-fill" type="color" class="defaults__swatch" aria-label="Default square fill" />
          </label>
          <label class="defaults__item">
            <span class="defaults__label">Border</span>
            <input id="def-border" type="color" class="defaults__swatch" aria-label="Default square border" />
          </label>
          <label class="defaults__item">
            <span class="defaults__label">Label 1</span>
            <input id="def-label" type="color" class="defaults__swatch" aria-label="Default label color, line 1" />
          </label>
          <label class="defaults__item">
            <span class="defaults__label">Label 2</span>
            <input id="def-label2" type="color" class="defaults__swatch" aria-label="Default label color, line 2 and beyond" />
          </label>
        </div>
        <span class="defaults__rule" aria-hidden="true"></span>
        <div class="defaults__set defaults__set--icon">
          <label class="defaults__item">
            <span class="defaults__label">Icon</span>
            <input id="def-icon" type="color" class="defaults__swatch" aria-label="Default icon color" />
          </label>
          <label class="defaults__item">
            <span class="defaults__label">
              <input id="def-icon-fill-on" type="checkbox" class="swatch__toggle"
                     aria-label="Fill the space inside icons by default" />Fill
            </span>
            <input id="def-icon-fill" type="color" class="defaults__swatch" aria-label="Default icon fill color" />
          </label>
        </div>
        <span class="defaults__rule" aria-hidden="true"></span>
        <div class="defaults__set defaults__set--table">
          <label class="defaults__item">
            <span class="defaults__label">Table</span>
            <input id="def-table" type="color" class="defaults__swatch" aria-label="Default table color" />
          </label>
          <label class="defaults__item">
            <span class="defaults__label">Border</span>
            <input id="def-table-border" type="color" class="defaults__swatch" aria-label="Default table border color" />
          </label>
        </div>
      </div>
    </header>

    <!-- ===== Table-select action bar (only shown in select mode) ===== -->
    <!-- ===== Selection bar. One bar for both halves of the work: the squares
             that are picked and the tables that are picked. ===== -->
    <div id="select-bar" class="selectbar" hidden>
      <span id="select-count" class="selectbar__count"><span class="hint-desktop">Click</span><span class="hint-touch">Tap</span> to select</span>
      <div class="selectbar__actions">
        <button id="btn-seat-all" class="btn btn--seat btn--icon btn--toggle" type="button" aria-pressed="false"
                title="Fill every selected square" aria-label="Fill all">
          <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-fill-all"/></svg>
        </button>
        <button id="btn-edit-selected" class="btn btn--primary btn--icon" type="button"
                title="Edit the selected squares" aria-label="Edit selected">
          <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-pencil"/></svg>
        </button>
        <span class="toolbar__sep" aria-hidden="true"></span>
        <button id="btn-table-round" class="btn" type="button"
                title="Squares selected: build a round table from them. Tables picked: make them round.">Round table</button>
        <button id="btn-table-square" class="btn" type="button"
                title="Squares selected: build a square table from them. Tables picked: make them square.">Square table</button>
        <button id="btn-table-merge" class="btn btn--icon" type="button" disabled
                title="Merge — not built yet" aria-label="Merge tables">
          <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-merge"/></svg>
        </button>
        <label class="field">
          <span class="field__label">Color</span>
          <input id="table-edit-color" class="field__input field__input--color" type="color" value="#8d6e63" />
        </label>
        <label class="field">
          <span class="field__label">Border</span>
          <input id="table-edit-border" class="field__input field__input--color" type="color" value="#5d4037" />
        </label>
        <button id="btn-table-rotate" class="btn" type="button" title="Turn the picked tables 45°">Rotate 45°</button>
        <span class="toolbar__sep" aria-hidden="true"></span>
        <button id="btn-table-remove" class="btn btn--empty btn--icon" type="button"
                title="Delete the selected items" aria-label="Delete selected">
          <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-trash"/></svg>
        </button>
        <button id="btn-select-clear" class="btn btn--ghost" type="button">Clear selection</button>
      </div>
    </div>

    <!-- ===================== Main grid area ===================== -->
    <main class="stage" id="stage">
      <div class="stage__zoom">
        <button id="btn-zoom-out" class="btn btn--icon" type="button" aria-label="Zoom out">−</button>
        <button id="btn-zoom-reset" class="btn btn--icon" type="button" aria-label="Reset zoom">⌂</button>
        <button id="btn-zoom-in" class="btn btn--icon" type="button" aria-label="Zoom in">+</button>
      </div>
      <div class="stage__scroll" id="stage-scroll">
        <div class="chart-wrap">
          <h1 class="chart-title" id="chart-title" hidden></h1>
          <div class="chart" id="chart" role="grid" aria-label="Seating grid">
            <!-- grid built by js/grid.js -->
          </div>
        </div>
      </div>
      <p class="stage__hint" id="stage-hint">
        Tap a square to fill it. <span class="hint-desktop">Right-click</span><span class="hint-touch">Long-press</span> to edit.
      </p>
    </main>
  </div>

  <!-- ===================== Edit pane (drawer / bottom sheet) ===================== -->
  <div class="editor" id="editor" hidden aria-hidden="true">
    <div class="editor__backdrop" data-close-editor></div>
    <section class="editor__panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <header class="editor__head">
        <div class="editor__headline">
          <h2 class="editor__title" id="editor-title">Edit square</h2>
          <button class="btn btn--icon editor__close" type="button" data-close-editor aria-label="Close">✕</button>
        </div>
        <!-- Square actions, filled in by js/editor.js for whichever pane is open -->
        <div class="editor__actions" id="editor-actions"></div>
      </header>
      <div class="editor__body" id="editor-body">
        <!-- populated by js/editor.js -->
      </div>
    </section>
  </div>

  <!-- ===================== Preview modal ===================== -->
  <div class="modal" id="preview" hidden aria-hidden="true">
    <div class="modal__backdrop" data-close-preview></div>
    <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header class="modal__head">
        <h2 class="modal__title" id="preview-title">Preview &amp; Export</h2>
        <!-- Paper size and orientation sit on the title line, where you can see
           what they do to the page you are about to export. -->
        <div class="toolbar__group" role="group" aria-label="Paper size">
          <label class="field">
            <span class="field__label" id="paper-label">Paper (Landscape)</span>
            <select id="paper-size" class="field__input"></select>
          </label>
          <!-- One button, not two: the spiral with the orientation's initial in
               it AND the word, since both did the same job. -->
          <button class="btn btn-rotate" type="button" title="Rotate page orientation">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true">
              <use class="btn-rotate__ring" href="#ui-orient-l"/>
              <text class="btn-rotate__letter" x="12" y="12" dominant-baseline="central" text-anchor="middle">L</text>
            </svg>
            <span class="btn-rotate__word">Landscape</span>
          </button>
          <label class="field field--custom-paper" hidden>
            <span class="field__label">W</span>
            <input id="paper-w" class="field__input field__input--num" type="number" min="1" step="0.1" value="11" inputmode="decimal" />
          </label>
          <label class="field field--custom-paper" hidden>
            <span class="field__label">H</span>
            <input id="paper-h" class="field__input field__input--num" type="number" min="1" step="0.1" value="8.5" inputmode="decimal" />
          </label>
          <label class="field field--custom-paper" hidden>
            <span class="field__label">Unit</span>
            <select id="paper-unit" class="field__input">
              <option value="in">in</option>
              <option value="mm">mm</option>
            </select>
          </label>
        </div>
        <button class="btn btn--icon" type="button" data-close-preview aria-label="Close">✕</button>
      </header>
      <div class="modal__body">
        <div class="preview__paper" id="preview-paper">
          <!-- a grid-line-free rendering, populated by js/export.js -->
        </div>
      </div>
      <footer class="modal__foot">
        <button id="btn-rows" class="btn" type="button"
                title="Download every square as a tab-separated sheet">Spreadsheet</button>
        <button id="btn-preview-save" class="btn" type="button" title="Download a .seatchart file">Save File</button>
        <button id="btn-preview-share" class="btn" type="button" title="Copy a link that reopens this layout">Share Link</button>
        <button id="btn-preview-print" class="btn" type="button">Print / PDF</button>
        <!-- Save Image opens a small menu; the menu is anchored to this wrapper. -->
        <div class="menu-anchor">
          <button id="btn-preview-png" class="btn btn--primary" type="button"
                  aria-haspopup="true" aria-expanded="false" title="Copy or download the rendered chart">Save Image ▾</button>
          <div id="image-menu" class="popmenu" role="menu" hidden>
            <button class="popmenu__item" type="button" role="menuitem" data-image="copy">Copy Image</button>
            <button class="popmenu__item" type="button" role="menuitem" data-image="link">Copy Link to Image</button>
            <button class="popmenu__item" type="button" role="menuitem" data-image="download">Download Image</button>
          </div>
        </div>
        <button class="btn" type="button" data-close-preview>Close</button>
      </footer>
    </section>
  </div>

  <!-- Classic scripts (not ES modules) so the app also runs when index.html is
       opened directly via file:// — module scripts are blocked over file://.
       Load order matters: each file defines globals used by later ones. -->
  <script src="js/state.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/paper.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/export.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rows.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
