      </header>
      <div class="editor__body" id="editor-body">
        <!-- populated by js/editor.js -->
      </div>
    </section>
  </div>

  <!-- ===================== Preview modal ===================== -->
  <div class="modal" id="preview" hidden aria-hidden="true">
    <div class="modal__backdrop" data-close-preview></div>
    <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header class="modal__head">
        <h2 class="modal__title" id="preview-title">Preview &amp; Export</h2>
        <!-- Paper size and orientation sit on the title line, where you can see
           what they do to the page you are about to export. -->
        <div class="toolbar__group" role="group" aria-label="Paper size">
          <label class="field">
            <span class="field__label" id="paper-label">Paper (Landscape)</span>
            <select id="paper-size" class="field__input"></select>
          </label>
          <!-- One button, not two: the spiral with the orientation's initial in
               it AND the word, since both did the same job. -->
          <button class="btn btn-rotate" type="button" title="Rotate page orientation">
            <svg class="iconbtn__svg" viewBox="0 0 24 24" aria-hidden="true">
              <use class="btn-rotate__ring" href="#ui-orient-l"/>
              <text class="btn-rotate__letter" x="12" y="12" dominant-baseline="central" text-anchor="middle">L</text>
            </svg>
            <span class="btn-rotate__word">Landscape</span>
          </button>
          <label class="field field--custom-paper" hidden>
            <span class="field__label">W</span>
            <input id="paper-w" class="field__input field__input--num" type="number" min="1" step="0.1" value="8.5" inputmode="decimal" />
          </label>
          <label class="field field--custom-paper" hidden>
            <span class="field__label" title="Length — the longer side">L</span>
            <input id="paper-h" class="field__input field__input--num" type="number" min="1" step="0.1" value="11" inputmode="decimal" />
          </label>
          <label class="field field--custom-paper" hidden>
            <span class="field__label">Unit</span>
            <select id="paper-unit" class="field__input">
              <option value="in">in</option>
              <option value="mm">mm</option>
            </select>
          </label>
        </div>
        <label class="field field--export-bg">
          <span class="field__label">Background</span>
          <input id="export-bg" data-no-transparent="1" class="field__input field__input--color" type="color" value="#ffffff"
                 aria-label="Exported page background colour" />
        </label>
        <button class="btn btn--icon" type="button" data-close-preview aria-label="Close">✕</button>
      </header>
      <div class="modal__body">
        <div class="preview__paper" id="preview-paper">
          <!-- a grid-line-free rendering, populated by js/export.js -->
        </div>
      </div>
      <footer class="modal__foot">
        <button id="btn-rows" class="btn" type="button"
                title="Download every square as a tab-separated sheet">Spreadsheet</button>
        <button id="btn-preview-save" class="btn" type="button" title="Download a .seatchart file">Save File</button>
        <button id="btn-preview-share" class="btn" type="button" title="Copy a link that reopens this layout">Share Link</button>
        <button id="btn-preview-print" class="btn" type="button">Print / PDF</button>
        <!-- Save Image opens a small menu; the menu is anchored to this wrapper. -->
        <div class="menu-anchor">
          <button id="btn-preview-png" class="btn btn--primary" type="button"
                  aria-haspopup="true" aria-expanded="false" title="Copy or download the rendered chart">Save Image ▾</button>
          <div id="image-menu" class="popmenu" role="menu" hidden>
            <button class="popmenu__item" type="button" role="menuitem" data-image="copy">Copy Image</button>
            <button class="popmenu__item" type="button" role="menuitem" data-image="link">Copy Link to Image</button>
            <button class="popmenu__item" type="button" role="menuitem" data-image="download">Download Image</button>
          </div>
        </div>
        <button class="btn" type="button" data-close-preview>Close</button>
      </footer>
    </section>
  </div>

  <!-- ===================== Settings modal ===================== -->
  <!-- Edits app configuration, which is kept apart from chart data: it lives in
       state.config and is persisted under its own localStorage key, never in a
       .seatchart file or share link. Body is built by js/settings.js. -->
  <div class="modal" id="settings" hidden aria-hidden="true">
    <div class="modal__backdrop" data-close-settings></div>
    <section class="modal__panel modal__panel--settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="modal__head modal__head--settings">
        <div class="modal__headrow">
          <h2 class="modal__title" id="settings-title">Settings</h2>
          <button class="btn btn--icon" type="button" data-close-settings aria-label="Close">✕</button>
        </div>
        <div class="settings-tabs" id="settings-tabs" role="tablist"></div>
      </header>
      <div class="modal__body modal__body--settings" id="settings-body">
        <!-- populated by js/settings.js -->
      </div>
      <footer class="modal__foot">
        <button class="btn" type="button" data-close-settings>Close</button>
      </footer>
    </section>
  </div>

  <!-- Classic scripts (not ES modules) so the app also runs when index.html is
       opened directly via file:// — module scripts are blocked over file://.
       Load order matters: each file defines globals used by later ones. -->
  <!-- Source map for "Export site". Holds each source file's text so the app can
       inline itself into a single file even over file://, where a fetch of a
       sibling file is blocked. REGENERATE with tools/gen-sources.py whenever any
       source changes, or Export site ships stale code. -->
  <script src="js/sources.js"></script>
  <script src="js/state.js"></script>
  <script src="js/history.js"></script>
  <script src="js/icons.js"></script>
  <!-- Icon-library browse catalog (Bootstrap Icons, MIT). Big and design-time
       only: gen-sources.py leaves it out of the export bundle. -->
  <script src="js/iconlib.js"></script>
  <script src="js/iconbrowser.js"></script>
  <script src="js/paper.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/colorpicker.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/walls.js"></script>
  <script src="js/export.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rows.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
